# Vmessage 1.6.2 (patched: Velocity 4.x 兼容 + Custom-Meta 支持任意多个槽位)
#
# 可用占位符：
#   #player#  玩家名
#   #prefix#  LuckPerms 前缀
#   #suffix#  LuckPerms 后缀
#   #message# 聊天内容
#   #server#  当前服务器名（走 [Aliases] 别名）
#   #oldserver# 上一个服务器名
#   [Custom-Meta] 定义的
#
# ★ %xxx% = 子服 PlaceholderAPI 变量（需要装 PAPIProxyBridge，见下面 [Message] 段）
#   直接在 format 里写 %playerTitle_use%、%legendaryguild_guild% 即可，
#   由玩家【所在的那个子服】的 PAPI 现算，代理端不用预先同步任何数据。

# 热重载
# false - 改完在控制台或游戏里执行 /vmessage reload（需要 vmessage.reload 权限）
# true  - 插件定时检查文件修改时间，改了就自动重载，不用敲命令、不用重启
auto-reload = false

# 自动重载的检查间隔（秒），最小 1 秒
auto-reload-interval-seconds = 5

# 排查日志总开关
# false - 控制台干干净净：起服和 reload 都不打「配置速览」那一大段（默认）
# true  - 起服和每次 reload 都把当前生效的关键配置打一遍
#         （改完配置想确认到底生效没、或者排查的时候开一下）
# 改完 /vmessage reload 就生效，不用重启
debug = false

[Message-format]
# false = 用 & 颜色码(+ &#RRGGBB hex)；true = MiniMessage
# 必须保持 false：LuckPerms 里存的是 & 颜色码，MiniMessage 模式会原样显示
minimessage = false

[Message]
# ★ 关键：false = 不拦原始聊天，只把格式化消息发给「除发送者所在服以外」的子服
#   （与线上 velocity-chat 的 passthrough=false 行为一致，子服插件不受影响）
#   改成 true 会 deny 原始事件并全服重发，1.19.1+ 会踢人，别开
format = "&8[&b#server#&8] &r%playerTitle_use% [&6%legendaryguild_guild%&r] #prefix#&f#player#&7: &r#message#"
all = false
commands = []
enabled = true

# 是否支持读取子服 PAPI 变量
# 代理端需装 PAPIProxyBridge-Velocity-*.jar
# 各子服需装 PAPIProxyBridge-Bukkit-*.jar
papiproxybridge = true

# 子服没装 PAPIProxyBridge-Bukkit 时，转发的格式
# 里面只能写 Vmessage 自己的占位符
# 不解析 %xxx%。若留空则使用 format。
no-papi-format = "<#player#>: #message#"

# 装了 PAPIProxyBridge-Bukkit 的服务器列表
# velocity.toml 里注册的服务器名（不是 [Aliases] 的中文别名），大小写不敏感
#
# ⚠️ 这是【白名单】—— 名单非空时，只有这里列出的服会解析 %xxx%，
#    没写进来的服一律走上面的 no-papi-format
#    留空 = 全部都按「装了桥接」处理（老版本 no-papi-servers = [] 就是这个行为），
#          代价是：新加一个没装桥接的服，它每次发言都要白等一次超时才出消息
papi-servers = []

# 缓存时间
papi-cache-millis = 30000

# 超时阈值（毫秒），超时后把 %xxx% 替换成空串
papi-timeout-millis = 1500

# 失败重试次数
# 获取变量失败后，%xxx% 会被替换成空串；
# 若被方括号包着的，例如 [&6%legendaryguild_guild%&r]，连[]一起删掉
papi-retry-times = 0

# strip = 去除颜色符号，且文本默认白色
# parse = 转发的消息解析颜色码
# keep  = 原样保留
# vmessage.color 权限玩家，强制解析颜色
message-colors = "strip"

# 需要哪个权限才能用渐变，例如 {#FF0000>}文字{#0000FF<}
# 无此权限的玩家，渐变标记会被去除，只保留文本
# 留空则所有玩家都能使用渐变
gradient-permission = "vmessage.gradient"
#
# parse 模式支持的写法（对齐 CMI/CMILib 的 CMIChatColor）：
#   &4  &c  &l  &r ...        传统 16 色 + k/l/m/n/o/r
#   &#FF0000  &#F00           hex（3 位会自动展开成 6 位）
#   &x&F&F&0&0&0&0            1.16 原生 hex 写法，会转成 &#FF0000
#   {#FF0000}  {#F00}         CMI 的花括号 hex
#   {#brown}                  命名色 —— 查下面那张表，查不到就摘掉
#   {#FF0000>}文字{#0000FF<}  渐变 —— 渐变段内的 &l 这类格式码会被丢掉；颜色名查不到就退化成纯文字
#   {@字体}                   自定义字体 —— 无法实现，忽略

# ★ 被子服插件取消的聊天（商店输入数量、菜单输入、签到输入……）要不要拦住
# 背景：代理收到聊天的同一时刻就把消息发给了别的子服，而子服插件的取消发生在【之后】
#       且没有机制回传给代理 —— 于是别的子服会看到玩家输入的「64」。
# true  = 先等 await-cancel-timeout-millis 毫秒，子服回一句「这条被取消了」就整条不转发
#         （跨服转发、Message.commands 一起都不做）
# false = 不等，收到就转发
# ⚠️ 各子服要装配套插件 VmessageSuppress 才会发信号；没装的话每次都白等到超时才转发。
#    可以用下面的 await-cancel-servers 把这类服排除掉 —— 它们不再等待，收到就转发。
await-cancel-signal = true

# ★ 哪些子服参与跨服聊天
#   名单里写 velocity.toml 里注册的服务器名（不是 [Aliases] 的中文别名），大小写都行。
#   不参与的服：既不把聊天发给别的服，也收不到别服发来的聊天（它自己服内的聊天不受影响）。
#   排除掉的服，Message.commands 不执行。
#   本服内部的聊天永远是子服自己广播的，跟这里无关。
#
# blacklist（默认）= 名单里的服【不】参与，其余全部参与 → 名单为空就是「全部参与」
# whitelist         = 【只有】名单里的服参与          → 名单为空就是「谁都不参与」，等于关掉跨服聊天
#   例 1：起床服和小游戏服别互相串台 → blacklist + ["bedwars", "minigame"]
#   例 2：只让生存和大厅互通       → whitelist + ["survival", "lobby"]
server-filter-mode = "blacklist"
server-filter = []

# 最长等多久（毫秒）。到期还没收到信号，就当正常聊天照常转发。
# 只影响「别的子服看到这条消息」的时间 —— 玩家自己所在服的聊天由子服自己广播，不受影响。
# 0 = 不等待（等于关闭）；上限 1000，写大了按 1000 算。一般 100 就够。
await-cancel-timeout-millis = 100

# ★ 哪些子服要等这个信号（名单里写 velocity.toml 里注册的服务器名，大小写都行）
#   没装 VmessageSuppress 的子服永远不会有信号，等它只是白等 —— 把它写进名单，收到就转发，零延迟。
#
# blacklist（默认）= 名单里的服【不】等（收到就转发），其余都等 → 名单为空就是「全都等」
# whitelist         = 【只有】名单里的服等                    → 名单为空就是「谁都不等」，等于关掉抑制
#   例 1：只有生存服装了 VmessageSuppress → whitelist + ["survival"]
#   例 2：小游戏服和起床服没装           → blacklist + ["minigame", "bedwars"]
await-cancel-server-mode = "blacklist"
await-cancel-servers = []

# ★ 悬停 / 点击：鼠标放到消息上时显示提示；点一下有动作
#
# 转发的聊天分两段，效果不一样：
#   前缀 + 名字（#message# 以外的部分）  → 悬停显示 prefix + hover（发送时间），点一下把 suggest 填进聊天框
#   正文（玩家真正说的那句话，#message#）→ 悬停显示 copy-hover，点一下把这句话复制到剪贴板
# Join/Leave/Kick 那些广播 → 只显示 hover，**不做点击**（广播没有「给谁发消息」的含义）
#
# hover / suggest 里可以写：
#   {time}   发送时刻，格式见下面的 time-format
#   {player} 发送者名字（广播里就是那条广播的主角）
#   {server} 发送者所在子服（走 [Aliases] 别名，例如「净土」）
#
# ★ prefix：悬停提示前面再加一截（默认先亮一个 [服务器名]；留空 = 不加）
#   ⚠️ 只加在【跨服聊天】上 —— Join/Leave/Kick 那些广播的提示里不会出现它
#   里面可以写（跟 Message.format 同一批解析，按【发送者所在服】算）：
#     #server#  /  #player#  /  #prefix#  /  #suffix#  /  [Custom-Meta] 定义的
#     %xxx%     子服 PAPI 变量（需要装 PAPIProxyBridge，例如 %playerTitle_use%）
#   例：prefix = "&8[&b#server#&8] &7来自 &f%playerTitle_use%&7"
#   ⚠️ 老配置里没有这个键时按「不加」处理（不会凭空多出一截），想要就自己加一行
#   ⚠️ prefix 是直接拼在 hover 前面的，不会自动加分隔符 —— 末尾想空格/换行就自己写，
#      写了就会【原样保留】（例如 "&8[&6#server#&8] " 那个尾空格是分隔符，不能省）
#
# hover 留空 = 不显示提示；suggest 留空 = 点了没反应
[Tooltip]
enabled = true
prefix = "&8[&6#server#&8] "
hover = "&e发送时间: &6{time}"
# suggest 末尾留一个空格，玩家点完接着就能输入内容
suggest = "/msg {player} "

# ★ 正文（玩家说的那句话）上的悬停提示 + 点一下复制到剪贴板
#   copy = false     整个关掉：正文恢复成跟前后一样（悬停看发送时间、点一下填 /msg）
#   copy-hover = ""  只不显示提示，点击照样复制
copy = true
copy-hover = "&7复制该文本"

# {time} 的时间格式（Java 写法）
#   HH:mm:ss              16:38:25
#   yyyy-MM-dd HH:mm:ss   2026-10-06 16:38:25
#   a h:mm                下午 4:38
time-format = "HH:mm:ss"

# {time} 用的时区；留空 = 服务器系统时区。例子："Asia/Shanghai"
time-zone = ""

# CMI 风格命名色对照表
[Message.named-colors]
brown = "#A52A2A"
orange = "#FFA500"
pink = "#FFC0CB"
purple = "#800080"
navy = "#000080"
teal = "#008080"
olive = "#808000"
maroon = "#800000"
lime = "#00FF00"
cyan = "#00FFFF"
silver = "#C0C0C0"
beige = "#F5F5DC"


# ★ 广播总闸（Join / Leave / Kick / Disconnect / Server-change 五类）
# true（默认）= 照常发；false = 五类一条都不发，也不用把下面五个段的 enabled 一个个改成 false
#   ⚠️ false 时各段自己的 commands 也不跑（跟把五个 enabled 全关掉的效果一致）
#   ⚠️ 只管广播，不管聊天：[Message] 的跨服转发不受它影响
[Broadcast]
enabled = true

[Join]
format = "&e#player# 加入了 #server#"
commands = []
enabled = true

[Leave]
format = "&e#player# 离开了 #oldserver#"
commands = []
enabled = true

[Kick]
format = "&c#player# 被踢出 #oldserver#"
commands = []
enabled = true

[Disconnect]
format = "&e#player# 断开了连接"
commands = []
enabled = true

[Server-change]
format = "&e#player# 从 #oldserver# 切换到 #server#"
commands = []
enabled = true

[Aliases]
lobby = "大厅"
survival = "净土"
survival2 = "乐土"
industry = "工业"
minigame = "游戏"
bedwars = "起床"
killer = "杀手"

# lp meta 信息别名
[Custom-Meta]
# 称号 = "title"
# 公会 = "guild"

# 解析网址
[Link]
enabled = true
text = "&4[&7链接&4]"
hover = "&7点击打开：&f{url}"
pattern = "https?://[A-Za-z0-9\\-._~:/?#\\[\\]@!$&'()*+,;=%]+"
